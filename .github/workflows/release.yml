name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: mcp-infisical-rs-release-publication
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/test.yml

  publish:
    needs: verify
    if: github.event.repository.private == false && vars.ENABLE_RELEASE_PUBLICATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/chrisbennight/mcp-infisical-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source and dependency licenses
        run: python3 scripts/prepare_release.py

      - name: Set up image builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release candidate
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/chrisbennight/mcp-infisical-rs
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT

      - name: Scan exact release candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          cache-dir: .cache/trivy
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: json
          output: .release/image-scan.json
          scanners: vuln
          list-all-pkgs: 'true'
          ignore-unfixed: 'false'
          exit-code: '0'

      - name: Qualify release image and produce runtime SBOM
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          trivy --version > .release/trivy-version.txt
          trivy --cache-dir .cache/trivy version --format json > .release/trivy-metadata.json
          trivy convert --format cyclonedx --output .release/runtime.cdx.json .release/image-scan.json
          python3 scripts/check_image_security.py .release/image-scan.json \
            --scanner-metadata .release/trivy-metadata.json \
            --digest "$IMAGE_DIGEST" --output .release/image-dispositions.json

      - name: Promote qualified image without rebuilding
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE:$GITHUB_REF_NAME" --tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE@$IMAGE_DIGEST"
          for published_tag in "$GITHUB_REF_NAME" "sha-$GITHUB_SHA"; do
            published_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$published_tag")"
            test "$published_digest" = "$IMAGE_DIGEST"
          done

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 scripts/prepare_release.py --record-digest

      - name: Retain release metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-${{ github.ref_name }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
