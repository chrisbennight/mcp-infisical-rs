name: renovate-threat-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  threat-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: bennight/renovate-threat-gate-action@fbfaa57fbec87133fbf6c9f1ba43d6c05f17b239 # v1.0.1
